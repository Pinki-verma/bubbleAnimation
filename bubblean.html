    <title>bubble Animation</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            list-style: none;
        }


        .outer {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #2F8DCC !important;
        }

        ul {

            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-around;
            transform: translateY(790px);

        }

        .row1 {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            box-shadow: inset 0 0 25px rgba(26, 190, 232, 0.4), inset -5px -10px 35px rgba(255, 255, 255, 0.777);
            animation: animations 4s 4s linear infinite;
        }

        .row1::after {
            content: ' ';
            width: 30px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            position: relative;
            top: 20px;
            left: 30px;
            display: block;
            transform: rotate(150deg);
            filter: blur(6px);
        }

        .row2 {
            width: 60px;
            height: 60px;
